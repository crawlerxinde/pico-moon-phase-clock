; PlatformIO Project Configuration File
;
; Waveshare RP2350-Touch-LCD-3.49 (RP2350B + 172x640 AXS15231B QSPI display)
;
; The original ESP32-S3 / TFT_eSPI target is kept in src/legacy for reference.
; This target is standalone: it uses the onboard PCF85063A RTC and computes
; sun/moon data locally, because this board has no WiFi module.
;
; Please visit https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = waveshare_rp2350_touch_lcd_3_49
src_dir = src
boards_dir = boards

[env:waveshare_rp2350_touch_lcd_3_49]
; Arduino-Pico fork with RP2350 support
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = waveshare_rp2350_touch_lcd_3_49
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0

; 16 MB flash on the RP2350B board
board_upload.maximum_size = 16777216
board_build.flash_size = 16MB

lib_deps =
    lvgl/lvgl@^8.3.11

build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -I${PROJECT_DIR}/include
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DARDUINO_WAVESHARE_RP2350_TOUCH_LCD_3_49
    -O2

build_src_filter =
    +<*>
    -<legacy/>

extra_scripts =
    post:scripts/post_upload.py

monitor_speed = 115200
upload_protocol = picotool
